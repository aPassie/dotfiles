# rendered text in all widgets supports pango markup (e.g. <b> or <i> tags)
# ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#general-remarks
#
# shortcuts to clear password buffer: ESC, Ctrl+U, Ctrl+Backspace
#
# NOTE: there is no input-field widget — type the password blind and press Enter.

# uncomment to enable fingerprint authentication
# auth {
#     fingerprint {
#         enabled = true
#         ready_message = Scan fingerprint to unlock
#         present_message = Scanning...
#         retry_delay = 250 # in milliseconds
#     }
# }

$font = JetBrainsMono Nerd Font Propo
source = mocha.conf

# Palette sampled from the wallpaper itself:
#   EDE4D2  aged paper  (the "COURTESY..." note)
#   1B1516  comic ink   (warm near-black)
#   A63F35  brick red   (the handwriting / the suit / the HELLO tag)
$paper    = rgba(EDE4D2FF)
$ink      = rgba(1B1516FF)
$ink_red  = rgba(A63F35FF)
$bar_red  = rgba(A63F35FF)
$hairline = rgba(1B151626)
$dropshad = rgba(00000030)

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
}

background {
    monitor =
    path = ~/Pictures/Wallpapers/HO_g0qJXoAA7gEy.jpeg
}

# ─── name badge ──────────────────────────────────────────────────────────────
# The collage has no empty space, so the type gets its own surface and reads as
# one more pinned clipping — a badge that rhymes with the "HELLO my name is /
# Peter Parker" tag in the opposite corner. Card is 364x200 at 56,44 with a 42px
# red header; 32px side padding, gaps measured off the real glyph ink.
# Widgets render in config order, so shapes must be declared before the labels.

# offset shadow (behind everything)
shape {
    monitor =
    size = 364, 200
    color = $dropshad
    rounding = 3
    border_size = 0
    position = 61, -51
    halign = left
    valign = top
}

# the paper itself
shape {
    monitor =
    size = 364, 200
    color = $paper
    rounding = 3
    border_size = 1
    border_color = $hairline
    position = 56, -44
    halign = left
    valign = top
}

# brick-red header bar
shape {
    monitor =
    size = 364, 42
    color = $bar_red
    rounding = 3
    border_size = 0
    position = 56, -44
    halign = left
    valign = top
}

# NAME  ·  PARTH SANKHLA
label {
    monitor =
    text = <span letter_spacing='5000'>PARTH SANKHLA</span>
    font_size = 14
    font_family = Rubik Medium
    color = $paper
    position = 87, -53
    halign = left
    valign = top
}

# TIME  ·  03:06
label {
    monitor =
    text = cmd[update:1000] date +"%I:%M"
    font_size = 72
    font_family = Rubik Black
    color = $ink
    position = 85, -90
    halign = left
    valign = top
}

# DATE  ·  THURSDAY · AUGUST 20
label {
    monitor =
    text = cmd[update:30000] echo "<span letter_spacing='4500'>$(date '+%A · %B %-d' | tr '[:lower:]' '[:upper:]')</span>"
    font_size = 14
    font_family = Rubik Medium
    color = $ink_red
    position = 88, -200
    halign = left
    valign = top
}

# ─── password entry: bare asterisks in the header's right space ──────────────
input-field {
    monitor =
    size = 108, 38
    position = 302, -48
    halign = left
    valign = top

    outline_thickness = 0
    inner_color = rgba(00000000)
    outer_color = rgba(00000000)
    check_color = rgba(00000000)
    fail_color = rgba(00000000)
    font_color = $paper
    font_family = Rubik Medium

    fade_on_empty = false
    dots_text_format = *
    dots_size = 0.40
    dots_spacing = 0.12
    dots_center = true
    hide_input = false

    placeholder_text =
    fail_text = <i><span size='10000'>try again dear</span></i>
}
