# Hyprlock — matches SilentSDDM 'rei' preset layout
# Left-aligned vertical column, vertically centered. Red Hat Display font.
# Lavender accent (#C3C6FB) on user's existing wallpaper.
# Battery-first: no blur, no animations, no shadows.

general {
    hide_cursor = false
    immediate_render = true
    ignore_empty_input = true
}

animations {
    enabled = false
}

auth {
    pam {
        enabled = true
        module = noctalia
    }
}

# Keep the user's actual desktop wallpaper. No blur per spec.
background {
    monitor =
    path = /home/shanks/.config/background
    blur_passes = 0
}

# ── Clock — RedHat Display Black 120px, top of left cluster ───────────────
label {
    monitor =
    text = $TIME
    color = rgb(c3c6fb)
    font_size = 120
    font_family = Red Hat Display Black
    position = 80, -190
    halign = left
    valign = center
    shadow_passes = 0
}

# ── Date — RedHat Display SemiBold 25px, below clock ──────────────────────
label {
    monitor =
    text = cmd[update:60000] date "+%A, %B %-d, %Y"
    color = rgb(c3c6fb)
    font_size = 25
    font_family = Red Hat Display SemiBold
    position = 80, -90
    halign = left
    valign = center
    shadow_passes = 0
}

# ── Avatar — rounded square, lavender border (rei: shape=square, radius=30)
image {
    monitor =
    path = /home/shanks/.face
    size = 88
    rounding = 22
    border_size = 3
    border_color = rgb(c3c6fb)
    position = 80, 0
    halign = left
    valign = center
    shadow_passes = 0
}

# ── Username — RedHat Display Bold 16px ───────────────────────────────────
label {
    monitor =
    text = $USER
    color = rgb(c3c6fb)
    font_size = 16
    font_family = Red Hat Display Bold
    position = 80, 80
    halign = left
    valign = center
    shadow_passes = 0
}

# ── Password input — 200×30, lavender border, ● char ──────────────────────
input-field {
    monitor =
    size = 200, 30
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.4
    dots_center = true
    dots_text_format = ●
    inner_color = rgba(00000000)
    outer_color = rgb(c3c6fb)
    font_color = rgb(c3c6fb)
    font_family = Red Hat Display
    fade_on_empty = false
    placeholder_text = <i>Enter Password</i>
    rounding = 10
    position = 80, 130
    halign = left
    valign = center
    check_color = rgb(c3c6fb)
    fail_color = rgb(ac97a4)
    fail_text = <b>$PAMFAIL</b>
    shadow_passes = 0
}
