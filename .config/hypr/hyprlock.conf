# rendered text in all widgets supports pango markup (e.g. <b> or <i> tags)
# ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#general-remarks
#
# shortcuts to clear password buffer: ESC, Ctrl+U, Ctrl+Backspace



# uncomment to enable fingerprint authentication
# auth {
#     fingerprint {
#         enabled = true
#         ready_message = Scan fingerprint to unlock
#         present_message = Scanning...
#         retry_delay = 250 # in milliseconds
#     }
# }

$font = JetBrainsMono Nerd Font Propo
source = mocha.conf

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = ~/Downloads/japan-arti.jpg
}

# Profile Picture
image {
    monitor =
    path = ~/Pictures/small-pics/gamer-cat.png
    size = 100
    border_size = 10
    border_color = $text
    position = 0, 280
    halign = center
    valign = bottom
}


#user
label {
    monitor =
    # text = cmd[update:1000] whoami
    text = Parth Sankhla
    font_size = 20
    font_family = $font Bold
    color = rgb(ffffff)
    position = 0, 240
    halign = center
    valign = bottom
    shadow_passes = 1
    shadow_size = 4
    shadow_boost = 1.2
    shadow_color = rgba(000000aa)
}

input-field {
    monitor =
    size = 200, 30
    outline_thickness = 3
    inner_color = rgba(ffffff55)

    # outer_color = $green $sapphire 30deg
    # check_color = $red $peach 120deg
    # fail_color = $red $peach 30deg

    outer_color = $peach
    check_color = $yellow
    fail_color = $red

    font_color = rgb(ffffff)
    fade_on_empty = false
    rounding = 15

    font_family = $font
    placeholder_text =
    fail_text =

    # uncomment to use a letter instead of a dot to indicate the typed password
    # dots_text_format = *
    dots_size = 0.4
    dots_spacing = 0.3

    # uncomment for an input indicator that hides password length (swaylock-style)
    # hide_input = true

    position = 0, 160
    halign = center
    valign = bottom
}



# TIME
label {
    monitor =
    text = cmd[update:1000] date +"%l:%M"
    font_size = 120
    font_family = $font black
    position = 0, -280
    halign = center
    valign = top
    color = rgb(ffffff)
    shadow_passes = 2
    shadow_size = 6
    shadow_boost = 1.2
    shadow_color = rgba(000000aa)
}

# day
label {
    monitor =
    text = cmd[update:1000] date +"%a"
    font_size = 16
    font_family = $font
    position = -150, -460
    halign = center
    valign = top
    color = $peach
    shadow_passes = 1
    shadow_size = 3
    shadow_boost = 1.2
    shadow_color = rgba(000000aa)
}

#separator
label {
    monitor =
    text = ●
    font_size = 12
    font_family = $font
    position = -100, -462
    halign = center
    valign = top
    color = rgb(ffffff)
    shadow_passes = 1
    shadow_size = 3
    shadow_boost = 1.2
    shadow_color = rgba(000000aa)
}

