$lock_cmd = pidof hyprlock || hyprlock
$suspend_cmd = systemctl suspend || loginctl suspend
$start_screenoff = systemctl --user restart screenoff-after-lock.timer
$cancel_screenoff = systemctl --user stop screenoff-after-lock.timer

general {
    lock_cmd = ($lock_cmd) & $start_screenoff
    unlock_cmd = $cancel_screenoff; niri msg action power-on-monitors
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = $start_screenoff
}

listener {
    timeout = 300 # 5 mins — lock
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600 # 10 mins — suspend
    on-timeout = $suspend_cmd
}
