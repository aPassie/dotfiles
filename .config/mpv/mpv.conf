# ─────────────────────────────────────────────────────────────────────────────
# mpv config — battery-first 4K playback on AMD Phoenix 780M + Wayland (niri)
# ─────────────────────────────────────────────────────────────────────────────

# Hardware video decode via AMD's UVD/VCN (H.264, HEVC, VP9, AV1).
# Without this, 4K HEVC eats ~25–35 W of CPU. With it, ~2–4 W on iGPU.
hwdec=vaapi

# Direct DMA-BUF handoff to the Wayland compositor — the compositor scans
# the video frame straight from the GPU, no per-frame copy or shader pass.
# Lowest possible power for plain playback.
# Falls back to gpu-next automatically if the compositor can't accept the format.
vo=dmabuf-wayland

# Minimal-overhead profile: no fancy scalers, no debanding, no interpolation.
profile=fast

# No motion interpolation (frame-rate doubling). Costs GPU, not needed at 60 Hz.
interpolation=no

# Don't stretch beyond display resolution.
video-unscaled=downscale-big

# ── Cache (smooth seeks on big 4K files) ────────────────────────────────────
cache=yes
cache-secs=30
demuxer-max-bytes=128MiB
demuxer-max-back-bytes=64MiB

# ── Subtitles ───────────────────────────────────────────────────────────────
sub-auto=fuzzy
slang=eng,en

# ── UX ──────────────────────────────────────────────────────────────────────
keep-open=yes
osc=yes
osd-bar=yes
save-position-on-quit=yes

# ── Screensaver / idle inhibit ──────────────────────────────────────────────
# mpv tells the compositor to inhibit idle while playing — Noctalia's idle
# manager and screensaver respect this. No "screen turns off mid-movie".
stop-screensaver=yes
