# Qt theming for systemd-user / dbus-activated services (e.g. xdg-desktop-portal-kde).
# niri sets these session-wide for apps it launches, but dbus-activated services
# don't inherit that. Mirroring them here makes the KDE file picker match the rest
# of the desktop (Darkly widgets + GlassBlack colors).
QT_QPA_PLATFORMTHEME=kde
QT_STYLE_OVERRIDE=Darkly
