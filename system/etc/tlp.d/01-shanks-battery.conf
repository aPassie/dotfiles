# Aggressive battery-first config for Lenovo Legion Slim 5 16APH8
# (Ryzen 7 7840HS / Radeon 780M) running Niri.
#
# Ported from prior Ubuntu 26.04 setup that achieved <8 W idle browsing.
# Replaces power-profiles-daemon — TLP handles CPU + USB + NVMe + Wi-Fi +
# Bluetooth + iGPU runtime PM in one place.

# --- CPU ---------------------------------------------------------------------
CPU_DRIVER_OPMODE_ON_AC=active
CPU_DRIVER_OPMODE_ON_BAT=active

CPU_SCALING_GOVERNOR_ON_AC=powersave
CPU_SCALING_GOVERNOR_ON_BAT=powersave

# Differentiated AC vs BAT — battery stays max-efficient, AC unlocks headroom.
CPU_ENERGY_PERF_POLICY_ON_AC=balance_power
CPU_ENERGY_PERF_POLICY_ON_BAT=power

# Boost on when plugged in, off on battery (preserves the dGPU-era discipline).
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0

CPU_HWP_DYN_BOOST_ON_AC=1
CPU_HWP_DYN_BOOST_ON_BAT=0

# AMD platform_profile: balanced on AC, low-power on battery.
PLATFORM_PROFILE_ON_AC=balanced
PLATFORM_PROFILE_ON_BAT=balanced

# --- PCIe / iGPU runtime PM --------------------------------------------------
PCIE_ASPM_ON_AC=powersupersave
PCIE_ASPM_ON_BAT=powersupersave

# AMD iGPU dynamic power management (auto = let kernel manage).
RADEON_DPM_PERF_LEVEL_ON_AC=auto
RADEON_DPM_PERF_LEVEL_ON_BAT=auto

RUNTIME_PM_ON_AC=auto
RUNTIME_PM_ON_BAT=auto
RUNTIME_PM_DRIVER_DENYLIST="mei_me nouveau radeon"

# --- USB autosuspend ---------------------------------------------------------
USB_AUTOSUSPEND=1
USB_EXCLUDE_AUDIO=1
USB_EXCLUDE_BTUSB=0
USB_EXCLUDE_PHONE=0
USB_EXCLUDE_PRINTER=1
USB_EXCLUDE_WWAN=1

# --- NVMe / disk -------------------------------------------------------------
DISK_APM_LEVEL_ON_AC="254 254"
DISK_APM_LEVEL_ON_BAT="128 128"

AHCI_RUNTIME_PM_ON_AC=auto
AHCI_RUNTIME_PM_ON_BAT=auto
AHCI_RUNTIME_PM_TIMEOUT=15

# --- Wi-Fi -------------------------------------------------------------------
WIFI_PWR_ON_AC=on
WIFI_PWR_ON_BAT=on

# --- Sound -------------------------------------------------------------------
SOUND_POWER_SAVE_ON_AC=1
SOUND_POWER_SAVE_ON_BAT=1
SOUND_POWER_SAVE_CONTROLLER=Y

# --- Bluetooth (don't touch — user can rfkill manually if not needed) --------
DEVICES_TO_DISABLE_ON_STARTUP=""

# --- Display: AMD ABM disabled for image accuracy ----------------------------
# Adaptive Backlight Modulation dims the backlight while boosting pixel
# values in software — power saving at the cost of contrast / colour
# fidelity. User chose 0 (off) on every state for accurate panel output.
AMDGPU_ABM_LEVEL_ON_AC=0
AMDGPU_ABM_LEVEL_ON_BAT=0
AMDGPU_ABM_LEVEL_ON_SAV=0
