# Do not let udev auto-load the NVIDIA driver when it sees the dGPU at boot.
#
# The dGPU is hot-removed and powered off at boot (disable-nvidia-dgpu.service). If the
# nvidia driver has already bound to it, that removal runs inside the driver and can
# deadlock against a power-profile (NVPCF) event from TLP / legion_laptop, which start at
# the same moment: the removal hangs forever and the login screen never appears
# (seen 2026-10-11, three boots in a row). With no driver bound, the removal is a plain
# PCI remove and cannot hang.
#
# "blacklist" only stops automatic loading. The dGPU toggle still works, because
# dgpu-enable-compute.sh / dgpu-enable-display.sh load the modules by name.
blacklist nvidia
blacklist nvidia_uvm
blacklist nvidia_modeset
blacklist nvidia_drm
