# dGPU compute mode never wants the display/KMS stack: nvidia_drm (modeset=1)
# creates a /dev/dri card that the running compositor (niri) grabs live, which
# pins the module and blocks teardown. CUDA needs only nvidia + nvidia_uvm.
# Display mode loads these explicitly via `modprobe --ignore-install ... modeset=1`.
install nvidia-modeset /bin/true
install nvidia-drm /bin/true
